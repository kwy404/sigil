name: Android smoke test

# Builds an x86_64 APK, runs it on an Android 14 emulator with the
# accessibility service and the overlay turned on, and keeps screenshots,
# the window hierarchy and logcat as the "smoke" artifact.
on:
  workflow_dispatch:

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Run the app on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/julia* /opt/microsoft /opt/google/chrome /usr/lib/jvm/java-8* /usr/lib/jvm/java-11*
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install

      - name: Build an x86_64 APK for the emulator
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=3 -PreactNativeArchitectures=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front emulated -camera-back none
          script: bash .github/smoke.sh

      # After the emulator, so a failing test still leaves the screenshots.
      # Android Gradle Plugin 9 only creates unit tests for the debug build type.
      - name: Run the native unit tests
        working-directory: android
        run: ./gradlew :sigil-control:testDebugUnitTest --no-daemon --max-workers=3

      - name: Keep the unit test reports
        if: always()
        run: mkdir -p smoke && cp -r android/../modules/sigil-control/android/build/reports/tests smoke/unit-tests 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke/
          if-no-files-found: warn
