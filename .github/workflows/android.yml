name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Tag to publish the APK under, for example v0.1.0. Leave empty to only build.
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The native C++ builds need more disk than the runner has free, so
      # remove preinstalled toolchains this build does not use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/julia* /opt/microsoft /opt/google/chrome /usr/lib/jvm/java-8* /usr/lib/jvm/java-11*
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      # Give the parallel C++ compilers room on the runner.
      - name: Add swap space
        run: |
          sudo fallocate -l 6G /swapfile-build
          sudo chmod 600 /swapfile-build
          sudo mkswap /swapfile-build
          sudo swapon /swapfile-build
          free -h
          nproc

      - run: npm ci

      - name: Generate the native project
        run: npx expo prebuild --platform android --no-install

      # The release build type of the generated project is signed with its
      # debug key, which makes an installable preview without any secret.
      - name: Build the release APK
        working-directory: android
        run: |
          (while true; do free -m | awk 'NR == 2 { print "memory used " $3 " of " $2 " MB" }'; sleep 60; done) &
          ./gradlew assembleRelease --no-daemon --max-workers=3 -PreactNativeArchitectures=arm64-v8a

      - run: cp android/app/build/outputs/apk/release/app-release.apk sigil-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sigil-android
          path: sigil-android.apk
          if-no-files-found: error

      - name: Publish the release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" sigil-android.apk --clobber
          else
            gh release create "$RELEASE_TAG" sigil-android.apk --target "$GITHUB_SHA" --title "Sigil ${RELEASE_TAG#v} for Android (preview)" --notes-file .github/release-notes.md
          fi
