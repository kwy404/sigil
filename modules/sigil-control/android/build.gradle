plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kwy404.sigil'
version = '0.1.0'

android {
  namespace "com.kwy404.sigil.control"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // Keep rules the app's R8 applies to MediaPipe; see proguard-rules.pro.
    consumerProguardFiles 'proguard-rules.pro'
  }
}

// MediaPipe Hand Landmarker model, Apache License 2.0, version 1 of the float16
// build. It is fetched at build time from Google's model bucket, as the
// official MediaPipe samples do, and its SHA-256 is checked, so every build
// bundles the same file. See docs/MODULES.md.
def handModelUrl = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
def handModelSha256 = 'fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1'
def handModelFile = file('src/main/assets/hand_landmarker.task')

def downloadHandModel = tasks.register('downloadHandLandmarker') {
  description = 'Downloads the MediaPipe hand landmarker model into the module assets and checks its SHA-256.'
  outputs.file(handModelFile)
  doLast {
    handModelFile.parentFile.mkdirs()
    if (!handModelFile.exists()) {
      def partial = new File(handModelFile.parentFile, 'hand_landmarker.task.part')
      new URL(handModelUrl).withInputStream { input -> partial.withOutputStream { output -> output << input } }
      partial.renameTo(handModelFile)
    }
    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(handModelFile.bytes).encodeHex().toString()
    if (handModelSha256 && digest != handModelSha256) {
      handModelFile.delete()
      throw new GradleException("hand_landmarker.task has SHA-256 ${digest}, expected ${handModelSha256}")
    }
    logger.lifecycle("hand_landmarker.task SHA-256 ${digest}")
  }
}

tasks.named('preBuild').configure { dependsOn downloadHandModel }

// MediaPipe's own test photos of hands (Apache License 2.0), for the tracker self test.
// They are not in MediaPipe's git; its commit bc2c5fc309a6478f07b51571a6a25e43ab530eb1
// pins them in third_party/external_files.bzl to these bucket generations and SHA-256
// sums, which are checked here too. See docs/ARCHITECTURE.md, Hand tracking model.
def selfTestBucket = 'https://storage.googleapis.com/mediapipe-assets/tasks/testdata/vision/'
def selfTestImages = [
  'pointing_up.jpg': ['1782185079090086', 'ecf8ca2611d08fa25948a4fc10710af9120e88243a54da6356bacea17ff3e36e'],
  'fist.jpg': ['1782184710240231', '43fa1cabf3f90d574accc9a56986e2ee48638ce59fc65af1846487f73bb2ef24'],
  'victory.jpg': ['1782185383577587', '84cb8853e3df614e0cb5c93a25e3e2f38ea5e4f92fd428ee7d867ed3479d5764'],
  'thumb_up.jpg': ['1782185354353621', '5d673c081ab13b8a1812269ff57047066f9c33c07db5f4178089e8cb3fdc0291'],
  'right_hands.jpg': ['1782185275057115', '4b5134daa4cb60465535239535f9f74c2842aba3aa5fd30bf04ef5678f93d87f'],
  'left_hands.jpg': ['1782184842333929', '240c082e80128ff1ca8a83ce645e2ba4d8bc30f0967b7991cf5fa375bab489e1'],
]
def selfTestFolder = file('src/main/assets/selftest')

def downloadSelfTest = tasks.register('downloadSelfTestImages') {
  description = 'Downloads the MediaPipe test photos of hands for the tracker self test and checks their SHA-256.'
  outputs.dir(selfTestFolder)
  doLast {
    selfTestFolder.mkdirs()
    def sha = { File target -> java.security.MessageDigest.getInstance('SHA-256').digest(target.bytes).encodeHex().toString() }
    selfTestImages.each { name, pin ->
      def target = new File(selfTestFolder, name)
      if (!target.exists() || sha(target) != pin[1]) {
        def partial = new File(selfTestFolder, name + '.part')
        new URL(selfTestBucket + name + '?generation=' + pin[0]).withInputStream { input -> partial.withOutputStream { output -> output << input } }
        target.delete()
        partial.renameTo(target)
      }
      def digest = sha(target)
      if (digest != pin[1]) {
        target.delete()
        throw new GradleException("selftest/${name} has SHA-256 ${digest}, expected ${pin[1]}")
      }
    }
    logger.lifecycle("Self test photos: ${selfTestImages.keySet().join(', ')}")
  }
}

tasks.named('preBuild').configure { dependsOn downloadSelfTest }

dependencies {
  // Headless JS tasks keep JavaScript timers running in the background (JsKeepAlive).
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.camera:camera-core:1.4.2'
  implementation 'androidx.camera:camera-camera2:1.4.2'
  implementation 'androidx.camera:camera-lifecycle:1.4.2'
  implementation 'com.google.mediapipe:tasks-vision:0.10.21'
  testImplementation 'junit:junit:4.13.2'
}
