plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.kwy404.sigil'
version = '0.1.0'

android {
  namespace "com.kwy404.sigil.control"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

// MediaPipe Hand Landmarker model, Apache License 2.0, version 1 of the float16
// build. It is fetched at build time from Google's model bucket, as the
// official MediaPipe samples do, and its SHA-256 is checked, so every build
// bundles the same file. See docs/MODULES.md.
def handModelUrl = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task'
def handModelSha256 = 'fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1'
def handModelFile = file('src/main/assets/hand_landmarker.task')

def downloadHandModel = tasks.register('downloadHandLandmarker') {
  description = 'Downloads the MediaPipe hand landmarker model into the module assets and checks its SHA-256.'
  outputs.file(handModelFile)
  doLast {
    handModelFile.parentFile.mkdirs()
    if (!handModelFile.exists()) {
      def partial = new File(handModelFile.parentFile, 'hand_landmarker.task.part')
      new URL(handModelUrl).withInputStream { input -> partial.withOutputStream { output -> output << input } }
      partial.renameTo(handModelFile)
    }
    def digest = java.security.MessageDigest.getInstance('SHA-256').digest(handModelFile.bytes).encodeHex().toString()
    if (handModelSha256 && digest != handModelSha256) {
      handModelFile.delete()
      throw new GradleException("hand_landmarker.task has SHA-256 ${digest}, expected ${handModelSha256}")
    }
    logger.lifecycle("hand_landmarker.task SHA-256 ${digest}")
  }
}

tasks.named('preBuild').configure { dependsOn downloadHandModel }

dependencies {
  implementation 'androidx.camera:camera-core:1.4.2'
  implementation 'androidx.camera:camera-camera2:1.4.2'
  implementation 'androidx.camera:camera-lifecycle:1.4.2'
  implementation 'com.google.mediapipe:tasks-vision:0.10.21'
  testImplementation 'junit:junit:4.13.2'
}
